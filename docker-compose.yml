services:
  nginx:
    image: nginx:latest
    ports:
      - "5000:80"
    volumes:
      - ./:/var/www:cached
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  php:

    build: ./php
    volumes:
      - ./:/var/www:cached
      - ./php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
    working_dir: /var/www
    depends_on:
      - db
      - memcached
      - minio
    environment:
      APP_ENV: "dev"
      LANG: "C.UTF-8"
      LC_ALL: "C.UTF-8"
      PHP_IDE_CONFIG: "serverName=localhost"
      SITE_URL: "http://localhost:5000"
      MEMCACHED_HOST: "memcached"
      MEMCACHED_PORT: "11211"
      OBJECT_STORAGE_ENDPOINT: "http://minio:9000"
      OBJECT_STORAGE_BUCKET: "stream-engine"
      OBJECT_STORAGE_REGION: "us-east-1"
      OBJECT_STORAGE_ACCESS_KEY: "stream-engine"
      OBJECT_STORAGE_SECRET_KEY: "stream-engine-secret"
      OBJECT_STORAGE_PUBLIC_BASE_URL: "http://localhost:9000/stream-engine"


  db:
    image: mariadb:12
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: app
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  composer:
    image: composer:latest
    volumes:
      - ./:/app
    working_dir: /app

  node:
    build: ./php
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    working_dir: /app

  memcached:
    image: memcached:latest
    ports:
      - "11211:11211"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: stream-engine
      MINIO_ROOT_PASSWORD: stream-engine-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  db_data:
  minio_data:
  node_modules:
