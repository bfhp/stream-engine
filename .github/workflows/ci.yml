name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          coverage: none

      - name: Validate Wiki source
        run: php bin/check-wiki-docs.php

  php:
    name: PHP (${{ matrix.database.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        database:
          - name: MariaDB 12
            image: mariadb:12
            health-cmd: healthcheck.sh --connect --innodb_initialized
          - name: MySQL 8.4
            image: mysql:8.4
            health-cmd: mysqladmin ping --host=127.0.0.1 --user=root --password=root

    services:
      database:
        image: ${{ matrix.database.image }}
        env:
          # Each image reads only its own variable.
          MARIADB_ROOT_PASSWORD: root
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.database.health-cmd }}"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: curl, dom, fileinfo, gd, intl, libxml, memcached, pdo, simplexml
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Audit PHP dependencies
        run: composer audit --locked --abandoned=report

      - name: Run Pint
        run: composer lint

      - name: Run PHPUnit
        run: composer test
        env:
          INSTALL_TEST_DB_DSN: mysql:host=127.0.0.1;port=3306
          INSTALL_TEST_DB_USERNAME: root
          INSTALL_TEST_DB_PASSWORD: root

      - name: Run CSRF audit
        run: composer audit:csrf

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: curl, dom, fileinfo, gd, intl, libxml, memcached, pdo, simplexml
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20.19'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Run Vitest
        run: npm test

      - name: Run TypeScript checks
        run: npm run typecheck

      - name: Run Vite build
        run: npm run build

  accessibility:
    # Installs a fresh site and scans its public and admin pages with
    # axe-core in Chromium for every bundled theme in English and Arabic
    # (right-to-left), each in the light and dark colour schemes;
    # tests/a11y/run.mjs switches theme and locale between runs. Known
    # violations live in tests/a11y/baseline.json; only new ones fail.
    name: Accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      database:
        image: mariadb:12
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: stream_engine
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      memcached:
        image: memcached:1.6
        ports:
          - 11211:11211

    env:
      A11Y_BASE_URL: http://127.0.0.1:8080
      # The administrator of a throwaway site that exists only for the length
      # of this job; its password is generated in the first step.
      A11Y_ADMIN_EMAIL: a11y@example.com
      A11Y_THEMES: default,bootstrap
      A11Y_LOCALES: en,ar

    steps:
      - name: Generate administrator password
        run: |
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          echo "A11Y_ADMIN_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: curl, dom, fileinfo, gd, intl, libxml, memcached, pdo, simplexml
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20.19'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Install Stream Engine
        run: >-
          php bin/install.php --no-interaction
          --app-env=prod
          --site-url="$A11Y_BASE_URL"
          --site-name="Stream Engine"
          --locale=en
          --admin-email="$A11Y_ADMIN_EMAIL"
          --admin-name="Administrator"
          --db-host=127.0.0.1
          --db-port=3306
          --db-name=stream_engine
          --db-username=root
          --db-password=root
        env:
          CMS_ADMIN_PASSWORD: ${{ env.A11Y_ADMIN_PASSWORD }}

      - name: Seed demo content
        run: php bin/seed-demo.php

      - name: Start web server
        run: |
          mkdir -p storage/a11y
          PHP_CLI_SERVER_WORKERS=4 nohup php -S 127.0.0.1:8080 -t public tests/a11y/router.php \
            > storage/a11y/server.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl --silent --fail --output /dev/null "$A11Y_BASE_URL/" && exit 0
            sleep 1
          done
          cat storage/a11y/server.log
          exit 1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run accessibility scan
        run: npm run test:a11y

      - name: Upload scan report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: accessibility
          path: |
            storage/a11y/
            !storage/a11y/admin-state.json
          retention-days: 14

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Blocks pull requests that add or upgrade to a dependency with a known
      # high or critical vulnerability, or with a licence outside the list
      # below. The list covers every licence in the current lock files and
      # is compatible with the project's LGPL-3.0-only licence.
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          allow-licenses: >-
            0BSD, Apache-2.0, BlueOak-1.0.0, BSD-2-Clause, BSD-3-Clause,
            CC-BY-4.0, CC0-1.0, ISC, LGPL-2.1-only, LGPL-2.1-or-later,
            LGPL-3.0-only, LGPL-3.0-or-later, MIT, MIT-0, MPL-2.0,
            Python-2.0, Unlicense, Zlib
