name: Accessibility

# The scan installs a site and drives Chromium through each theme/locale
# combination, so it runs only when something it can see has changed:
# templates, styles, scripts, built assets, translations or the scan itself.
# A weekly run catches anything that reaches the pages another way (PHP
# that renders markup, dependency updates). Any branch can be scanned on
# demand from the Actions tab ("Run workflow").

on:
  push:
    branches: [main]
    paths:
      - 'views/**'
      - 'assets-src/**'
      - 'public/assets/**'
      - 'src/Lang/**'
      - 'tests/a11y/**'
      - 'bin/install.php'
      - 'bin/seed-demo.php'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/accessibility.yml'
  pull_request:
    paths:
      - 'views/**'
      - 'assets-src/**'
      - 'public/assets/**'
      - 'src/Lang/**'
      - 'tests/a11y/**'
      - 'bin/install.php'
      - 'bin/seed-demo.php'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/accessibility.yml'
  schedule:
    - cron: '0 4 * * 1'   # weekly, Monday 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: accessibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  accessibility:
    # Installs a fresh site and scans its public and admin pages with
    # axe-core in Chromium for every bundled theme in English and Arabic
    # (right-to-left), each in the light and dark colour schemes;
    # tests/a11y/run.mjs switches theme and locale between runs. Known
    # violations live in tests/a11y/baseline.json; only new ones fail.
    name: Accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      database:
        image: mariadb:12
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: stream_engine
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      memcached:
        image: memcached:1.6
        ports:
          - 11211:11211

    env:
      A11Y_BASE_URL: http://127.0.0.1:8080
      # The administrator of a throwaway site that exists only for the length
      # of this job; its password is generated in the first step.
      A11Y_ADMIN_EMAIL: a11y@example.com
      A11Y_THEMES: default,bootstrap
      # Pull requests scan English only, which halves the run; Arabic
      # (right-to-left) is scanned on main, weekly and on manual runs.
      A11Y_LOCALES: ${{ github.event_name == 'pull_request' && 'en' || 'en,ar' }}

    steps:
      - name: Generate administrator password
        run: |
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          echo "A11Y_ADMIN_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: curl, dom, fileinfo, gd, intl, libxml, memcached, pdo, simplexml
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20.19'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Install Stream Engine
        run: >-
          php bin/install.php --no-interaction
          --app-env=prod
          --site-url="$A11Y_BASE_URL"
          --site-name="Stream Engine"
          --locale=en
          --admin-email="$A11Y_ADMIN_EMAIL"
          --admin-name="Administrator"
          --db-host=127.0.0.1
          --db-port=3306
          --db-name=stream_engine
          --db-username=root
          --db-password=root
        env:
          CMS_ADMIN_PASSWORD: ${{ env.A11Y_ADMIN_PASSWORD }}

      - name: Seed demo content
        run: php bin/seed-demo.php

      - name: Start web server
        run: |
          mkdir -p storage/a11y
          PHP_CLI_SERVER_WORKERS=4 nohup php -S 127.0.0.1:8080 -t public tests/a11y/router.php \
            > storage/a11y/server.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl --silent --fail --output /dev/null "$A11Y_BASE_URL/" && exit 0
            sleep 1
          done
          cat storage/a11y/server.log
          exit 1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run accessibility scan
        run: npm run test:a11y

      - name: Upload scan report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: accessibility
          path: |
            storage/a11y/
            !storage/a11y/admin-state.json
          retention-days: 14
