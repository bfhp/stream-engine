# Monthly version updates, one grouped pull request per ecosystem.
#
# Major versions are skipped here on purpose: they can break things and are
# upgraded deliberately by hand. The `update-types` ignore rule only affects
# version updates - Dependabot security updates are still raised for any
# version, including majors.
#
# Every ecosystem waits 7 days after a release before proposing it
# (`cooldown`): most hijacked or broken releases are caught and yanked within
# days, and a monthly schedule loses nothing by waiting a week. Like the
# major-version rule, this only affects version updates - security updates
# are raised immediately.
#
# Docker base images (docker/php/Dockerfile) are not tracked: their tags pin
# the PHP and Node runtime versions, which change deliberately together with
# composer.json, package.json and CI.
version: 2

updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      composer:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

